<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnerGlobix Home</title>
    <!-- Preload critical images -->
    <link rel="preload" href="assets/images/second-large.jpg" as="image" />
    <link rel="preload" href="assets/images/large-lux.jpg" as="image" />
    <link rel="preload" href="assets/images/development-logo.png" as="image" />
    <link rel="preload" href="assets/images/top-logo.png" as="image" />

    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      @font-face {
        font-family: "Adelle-Sans-Light";
        src: url("./assets/Document\ fonts/Adelle-Sans-Light.otf")
          format("truetype");
        /* IE9 Compat Modes */
        font-weight: normal;
        font-style: normal;
      }

      body,
      html {
        height: 100vh;
        height: 100svh;
        width: 100%;
        margin: 0;
        font-family: "Adelle-Sans-Light";
        background-color: #000;
        position: relative;
        overflow: hidden;
      }

      .bg-layer-1 {
        background-image: url("assets/images/second-large.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        animation: crossfade-1 16s infinite ease-in-out;
      }
      .bg-layer-2 {
        background-image: url("assets/images/large-lux.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        animation: crossfade-2 16s infinite ease-in-out;
      }

      .hamburger-btn {
        background: none;
        border: none;
        color: #fff;
        padding: 0;
        cursor: pointer;
        pointer-events: auto;
        margin-top: 0.5rem; /* mt-2 */
        transition: color 0.15s ease-in-out;
      }

      .hamburger-btn:hover {
        color: #d1d5db; /* hover:text-gray-300 */
      }

      .hamburger-btn svg {
        width: 2rem; /* w-8 */
        height: 2rem; /* h-8 */
      }

      @keyframes crossfade-1 {
        0%,
        40%,
        100% {
          opacity: 1;
        }
        50%,
        90% {
          opacity: 0;
        }
      }
      @keyframes crossfade-2 {
        0%,
        40%,
        100% {
          opacity: 0;
        }
        50%,
        90% {
          opacity: 1;
        }
      }

      .overlay-main {
        background: rgba(0, 0, 0, 0.15);
        z-index: 10;
      }

      /* Custom Styles for high fidelity layout */
      .header-spacer {
        width: 2rem;
        height: 2rem;
      }

      .logo-main {
        height: 5rem;
        object-fit: contain;
      }

      .btn-hamburger {
        background: none;
        border: none;
        padding: 0;
        color: #fff;
        width: 2rem;
        height: 2rem;
        transition: color 0.3s ease;
      }

      .btn-hamburger:hover {
        color: #ccc;
      }

      .btn-hamburger svg {
        width: 100%;
        height: 100%;
      }

      .hover-scale {
        transition: transform 0.3s ease;
      }

      .hover-scale:hover {
        transform: scale(1.05);
      }

      .content-container {
        max-width: 896px; /* 4xl */
      }

      .hero-title {
        color: #fff;
        font-size: 1.25rem; /* text-xl */
        font-weight: 300; /* font-light */
        letter-spacing: 0.05em; /* tracking-wider */
        margin-bottom: 2rem; /* mb-8 */
        line-height: 1.625; /* leading-relaxed */
        max-width: 768px; /* max-w-3xl */
        filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.4));
      }

      .btn-discover {
        /* border: 1px solid rgba(255, 255, 255, 0.2); */
        color: #c2b18f;
        background-color: #000;
        padding: 0.6rem 2rem; /* px-8 py-2 */
        letter-spacing: 0.25em; /* tracking-[0.25em] */
        text-indent: 0.25em; /* offset the letter-spacing on the right of the last letter */
        font-size: 11px; /* text-[11px] */
        text-transform: uppercase;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        transition: all 0.3s ease;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        text-decoration: none;
      }

      .btn-discover:hover {
        background-color: #fff;
        color: #000;
        border-color: #fff;
      }

      .logo-holdings {
        height: 2.5rem; /* h-10 */
        object-fit: contain;
      }

      .text-holdings {
        color: white;
        font-size: 0.65rem; /* text-xs */
        letter-spacing: 0.1em; /* tracking-[0.3em] */
        font-weight: 400; /* font-semibold */
        margin-top: 0.25rem; /* mt-1 */
      }

      .footnote {
        color: rgba(255, 255, 255, 0.5); /* text-white/50 */
        font-size: 9px; /* text-[9px] */
        letter-spacing: 0.25em; /* tracking-[0.25em] */
        text-transform: uppercase;
        font-weight: 300; /* font-light */
        margin-top: 1.5rem; /* mt-6 */
        text-align: center;
      }

      /* Responsive updates */
      @media (min-width: 768px) {
        .header-spacer {
          width: 2.5rem;
          height: 2.5rem;
        }
        .logo-main {
          height: 6.5rem; /* h-26 */
        }
        .btn-hamburger {
          width: 2.5rem;
          height: 2.5rem;
        }
        .hero-title {
          font-size: 1.875rem; /* text-3xl */
          margin-bottom: 2.5rem; /* mb-10 */
        }
        .btn-discover {
          padding: 0.7rem 2.5rem; /* px-10 py-2.5 */
          font-size: 12px; /* text-xs */
        }
        .logo-holdings {
          height: 3rem; /* h-12 */
        }
        .footnote {
          font-size: 0.75rem; /* text-xs */
        }
      }

      @media (min-width: 992px) {
        .hero-title {
          font-size: 2.25rem; /* text-4xl */
        }
      }

      /* Dropdown Navigation Menu / Drawer Sidebar */
      .nav-menu-container {
        position: fixed !important;
        top: 0 !important;
        right: -320px !important;
        /* hidden off-screen by default on mobile */
        width: 300px !important;
        height: 100vh !important;
        background-color: rgba(0, 0, 0, 0.96) !important;
        backdrop-filter: blur(12px) !important;
        border-left: 1px solid rgba(255, 255, 255, 0.1) !important;
        z-index: 1000 !important;
        display: flex !important;
        flex-direction: column !important;
        padding: 2rem 1.5rem !important;
        transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
        pointer-events: none !important;
        overflow-y: auto !important;
        box-sizing: border-box !important;
      }

      .nav-menu-container.active {
        right: 0 !important;
        /* slide in on mobile */
        pointer-events: auto !important;
      }

      .close-menu-btn {
        align-self: flex-end !important;
        background: none !important;
        border: none !important;
        color: #fff !important;
        cursor: pointer !important;
        padding: 0.5rem !important;
        margin-bottom: 1.5rem !important;
        transition: color 0.15s ease-in-out !important;
      }

      .close-menu-btn:hover {
        color: #c2b18f !important;
      }

      /* Desktop dropdown styling */
      @media (min-width: 992px) {
        .nav-menu-container {
          position: absolute !important;
          top: 100% !important;
          right: 0 !important;
          left: auto !important;
          width: 250px !important;
          height: auto !important;
          background-color: rgba(0, 0, 0, 0.95) !important;
          backdrop-filter: blur(8px) !important;
          border: 1px solid rgba(255, 255, 255, 0.1) !important;
          border-radius: 0.5rem !important;
          z-index: 1000 !important;
          padding: 0.5rem 0 !important;
          opacity: 0 !important;
          visibility: hidden !important;
          transform: translateY(-10px) !important;
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
          overflow-y: visible !important;
          /* to allow submenus to fly out */
        }

        .nav-menu-container.active {
          opacity: 1 !important;
          visibility: visible !important;
          transform: translateY(0) !important;
          pointer-events: auto !important;
        }

        .close-menu-btn {
          display: none !important;
        }
      }

      .nav-menu-list {
        list-style: none !important;
        padding: 0 !important;
        margin: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 0 !important;
        width: 100% !important;
      }

      .nav-menu-item {
        margin: 0 !important;
        width: 100% !important;
        text-align: left !important;
        padding: 0 !important;
      }

      .nav-menu-link {
        color: #fff !important;
        font-size: 0.9rem !important;
        font-weight: 400 !important;
        letter-spacing: 0.1em !important;
        text-decoration: none !important;
        text-transform: uppercase !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        padding: 1rem 1.5rem !important;
        transition:
          background-color 0.2s ease,
          color 0.2s ease !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .nav-menu-link:hover {
        color: #c2b18f !important;
        background-color: rgba(255, 255, 255, 0.05) !important;
      }

      /* Submenu styles */
      .nav-submenu {
        list-style: none !important;
        padding: 0 !important;
        margin: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 0 !important;
        width: 100% !important;
      }

      .submenu-link {
        color: #fff !important;
        text-decoration: none !important;
        transition:
          color 0.2s ease,
          background-color 0.2s ease !important;
        display: block !important;
        width: 100% !important;
        box-sizing: border-box !important;
        text-align: left !important;
      }

      .submenu-arrow {
        transition: transform 0.2s ease-in-out !important;
        margin-left: 0.5rem !important;
        vertical-align: middle !important;
      }

      /* Mobile/Tablet Submenu Accordion styles */
      @media (max-width: 991.98px) {
        .nav-submenu {
          display: none !important;
          padding-left: 1.5rem !important;
        }

        .nav-submenu li {
          padding-top: 0px !important;
          padding-bottom: 0px !important;
        }

        .nav-submenu.open {
          display: flex !important;
          flex-direction: column !important;
        }

        .submenu-link {
          color: #ccc !important;
          font-size: 0.9rem !important;
          display: block !important;
          padding: 0.6rem 0 !important;
        }

        .submenu-link:hover {
          color: #c2b18f !important;
        }

        .has-submenu.active > .nav-menu-link .submenu-arrow {
          transform: rotate(180deg) !important;
        }
      }

      /* Desktop inline expanding submenus */
      @media (min-width: 992px) {
        .nav-menu-item {
          position: relative !important;
        }

        .nav-submenu {
          position: relative !important;
          top: auto !important;
          right: auto !important;
          left: auto !important;
          margin: 0 !important;
          width: 100% !important;
          background-color: transparent !important;
          backdrop-filter: none !important;
          border: none !important;
          border-radius: 0 !important;
          padding: 0 !important;
          max-height: 0 !important;
          overflow: hidden !important;
          opacity: 0 !important;
          visibility: hidden !important;
          transition:
            max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
            opacity 0.3s ease,
            visibility 0.3s ease !important;
        }

        .nav-submenu.open {
          opacity: 1 !important;
          visibility: visible !important;
          max-height: 300px !important;
        }

        .submenu-link {
          font-size: 0.9rem !important;
          text-transform: uppercase !important;
          display: block !important;
          padding: 0.75rem 2.5rem !important;
        }

        .submenu-link:hover {
          color: #c2b18f !important;
          background-color: rgba(255, 255, 255, 0.05) !important;
        }

        .submenu-arrow {
          transform: none !important;
          transition: transform 0.2s ease-in-out !important;
        }

        .has-submenu.active > .nav-menu-link .submenu-arrow {
          transform: rotate(180deg) !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Layers for Crossfade Animation -->
    <div
      class="position-absolute top-0 start-0 w-100 h-100 z-0 pe-none overflow-hidden"
    >
      <div class="bg-layer-1 position-absolute top-0 start-0 w-100 h-100"></div>
      <div class="bg-layer-2 position-absolute top-0 start-0 w-100 h-100"></div>
    </div>

    <!-- Main Overlay Layout -->
    <div
      class="position-absolute top-0 start-0 w-100 h-100 overlay-main d-flex flex-column justify-content-between align-items-center py-5 px-3 py-md-5 px-md-5"
    >
      <!-- Top Header -->
      <div
        class="w-100 d-flex justify-content-between align-items-center pe-none position-relative"
      >
        <!-- Spacer to balance hamburger and center the logo -->
        <div class="header-spacer"></div>

        <!-- Center Logo -->
        <a
          href="https://energlobix.com/holding/"
          class="pe-auto hover-scale d-inline-block"
        >
          <img
            src="assets/images/development-logo.png"
            alt="EnerGlobix Development"
            class="logo-main"
          />
        </a>

        <!-- Hamburger Icon -->
        <button
          class="hamburger-btn"
          id="open-menu-btn"
          aria-label="Toggle navigation"
        >
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>

        <!-- Dropdown Menu / Sidebar -->
        <div class="nav-menu-container" id="nav-menu">
          <!-- Sidebar Close Button (only visible on mobile/tablet) -->
          <button
            class="close-menu-btn"
            id="close-menu-btn"
            aria-label="Close navigation"
          >
            <svg
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              width="24"
              height="24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>

          <ul class="nav-menu-list">
            <li class="nav-menu-item has-submenu">
              <a href="#" class="nav-menu-link toggle-submenu">
                Development
                <svg
                  class="submenu-arrow"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  width="12"
                  height="12"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </a>
              <ul class="nav-submenu">
                <li>
                  <a
                    href="https://energlobixdevelopment.kasehub.com/index.html"
                    class="submenu-link"
                    >Home</a
                  >
                </li>
                <li>
                  <a
                    href="https://energlobixdevelopment.kasehub.com/who-we-are.html"
                    class="submenu-link"
                    >About</a
                  >
                </li>
                <li>
                  <a
                    href="https://energlobixdevelopment.kasehub.com/how-we-do-it.html"
                    class="submenu-link"
                    >Developments</a
                  >
                </li>
                <li>
                  <a
                    href="https://energlobixdevelopment.kasehub.com/invest.html"
                    class="submenu-link"
                    >Location</a
                  >
                </li>
              </ul>
            </li>

            <li class="nav-menu-item">
              <a href="https://energlobix.com/holding/" class="nav-menu-link"
                >Holding</a
              >
            </li>
          </ul>
        </div>
      </div>

      <!-- Center Content -->
      <div
        class="d-flex flex-column align-items-center justify-content-center text-center content-container px-3 my-auto pe-auto"
      >
        <h1 class="hero-title">
          EnerGlobix. Shaping global investment opportunities & communities
        </h1>
        <a href="https://energlobixdevelopment.kasehub.com/">
          <div class="btn-discover">DISCOVER</div>
        </a>
      </div>

      <!-- Footer Section -->
      <div class="w-100 d-flex flex-column align-items-center mt-auto pe-none">
        <!-- Holdings Logo (Middle Bottom) -->
        <a
          href="https://energlobix.com/holding/"
          class="d-flex flex-column align-items-center pe-auto hover-scale text-decoration-none"
        >
          <img
            src="assets/images/top-logo.png"
            alt="EnerGlobix Holdings"
            class="logo-holdings"
          />
          <div class="text-holdings">HOLDINGS</div>
        </a>

        <!-- Footnote Subtext -->
        <p class="footnote">
          ENERGLOBIX DEVELOPMENT - A PART OF ENERGLOBIX HOLDING
        </p>
      </div>
    </div>

    <script>
      // Robust Menu Toggle and Accordion Logic
      function initNavigationMenu() {
        const openBtn = document.getElementById("open-menu-btn");
        const navMenu = document.getElementById("nav-menu");
        const closeBtn = document.getElementById("close-menu-btn");

        if (!openBtn || !navMenu) return;

        // Prevent duplicate listener binding
        if (openBtn.dataset.bound) return;
        openBtn.dataset.bound = "true";

        openBtn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          navMenu.classList.toggle("active");
        });

        if (closeBtn) {
          closeBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            navMenu.classList.remove("active");
          });
        }

        // Close menu when clicking outside
        document.addEventListener("click", (e) => {
          if (
            navMenu.classList.contains("active") &&
            !navMenu.contains(e.target) &&
            !openBtn.contains(e.target)
          ) {
            navMenu.classList.remove("active");
          }
        });
      }

      function initSubmenuAccordion() {
        const submenuToggles = document.querySelectorAll(".toggle-submenu");
        submenuToggles.forEach((toggle) => {
          if (toggle.dataset.bound) return;
          toggle.dataset.bound = "true";

          toggle.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const parentLi = toggle.closest(".has-submenu");
            const submenu = parentLi.querySelector(".nav-submenu");

            // Close other submenus first (accordion behavior)
            document.querySelectorAll(".nav-submenu").forEach((sub) => {
              if (sub !== submenu) sub.classList.remove("open");
            });
            document.querySelectorAll(".has-submenu").forEach((li) => {
              if (li !== parentLi) li.classList.remove("active");
            });

            submenu.classList.toggle("open");
            parentLi.classList.toggle("active");
          });
        });
      }

      // Initialize instantly
      initNavigationMenu();
      initSubmenuAccordion();

      // Initialize on DOMContentLoaded
      document.addEventListener("DOMContentLoaded", () => {
        initNavigationMenu();
        initSubmenuAccordion();
      });

      // Initialize on Window Load
      window.addEventListener("load", () => {
        initNavigationMenu();
        initSubmenuAccordion();
      });
    </script>
  </body>
</html>
